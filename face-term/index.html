<script type="module">
  import {

  } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';

<script>

let VID_W = 640;
let VID_H = 480;
let GRD = 28;
let GRD_ROW = 16;
let GRD_COL = 20;
let CNV_W = GRD * GRD_COL;
let CNV_H = GRD * GRD_ROW;
let Sobel = new SOBEL(CNV_W,CNV_H);

let Crt = new CRT(GRD_COL*2*8, GRD_ROW*16);

let cnv0 = document.createElement("canvas");
cnv0.width = CNV_W;
cnv0.height = CNV_H;
cnv0.style="position:absolute;left:0px;top:28px"
// document.body.appendChild(cnv0);

let cnv1 = document.createElement("canvas");
cnv1.width = window.innerHeight*3/2;
cnv1.height = window.innerHeight;
cnv1.style="position:absolute;left:0px;top:0px"
// document.body.appendChild(cnv1);

function clack(){
  if (!window.audioCtx){
    window.audioCtx = new AudioContext();
  }
  const ab = audioCtx.createBuffer( 2, 2000, 11025);
  let env = [
    [0,0],[0.005,0.1],[0.01,0.8+Math.random()*0.5],[0.15,0.3],[0.45,0.1],[0.5,0.4+Math.random()*0.4],[0.6,0.1],[1.0,0.0]
  ]
  for (let i = 1; i < env.length-1; i++){
    env[i][0] += (Math.random()-0.5)*0.005;
  }
  let frq = Math.random();
  let amp = [Math.random()*0.6+0.4, Math.random()*0.6+0.4];
  for (let ch = 0; ch < ab.numberOfChannels; ch++) {
    let buf = ab.getChannelData(ch);
    for (let i = 0; i < buf.length; i++) {
      let t = i/buf.length;
      let v = Math.random()*2-1
      for (let j = 1; j < env.length; j++){
        if (t < env[j][0]){
          let [t0,v0] = env[j-1];
          let [t1,v1] = env[j];
          let tt = (t-t0)/(t1-t0);
          let vv = v0 + (v1-v0) * tt;
          v*=vv;
          break;
        }
      }
      v += Math.sin(Math.sqrt(t)*Math.PI*25*frq)*0.2*(1-t)
      buf[i] = v*0.5*amp[ch];
    }
  }
  const source = audioCtx.createBufferSource();
  source.buffer = ab;
  source.connect(audioCtx.destination);
  source.start();
}

async function main(){

  console.log('Loading model...');
  // await NN.loadModel();
  NN.model = await tf.loadLayersModel(
    /*__URL__*/"models/tfjs-model-5026090469481548.json",
    {weightUrlConverter:function(){
      return /*__URL__*/"models/tfjs-model-5026090469481548.weights.bin"
    }}
  );
  
  console.log('Done.');

  function untilReady(vars) {
    return new Promise((resolve, reject) => {
      const start = Date.now();
      function check() {
        const allAvailable = vars.every(path => {
          return path.split('.').reduce((obj, key) => obj?.[key], window) !== undefined;
        });
        if (allAvailable) {
          resolve();
        } else {
          setTimeout(check, 50);
        }
      }
      check();
    });
  }

  let path = '';
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoDevices = devices.filter(device => device.kind === "videoinput");
  const chosen = videoDevices.find(d => d.label.includes(path));
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      deviceId: chosen?.deviceId || videoDevices[0].deviceId,
      width: { ideal: VID_W },
      height: { ideal: VID_H }
    }
  });
  const videoElement = document.createElement("video");
  videoElement.autoplay = true;
  videoElement.playsInline = true;
  videoElement.muted = true;   
  videoElement.style.position = "absolute";
  // videoElement.style.opacity = "1";
  videoElement.style.opacity = "0.001";
  videoElement.style.left = "600px";
  videoElement.style.top = "28px";
  videoElement.style.transform = "scale(-1,1)"
  videoElement.style.pointerEvents = "none";
  videoElement.srcObject = stream;
  videoElement.onloadeddata = function(){
    window.videoLoaded = 1;
  }
  document.body.appendChild(videoElement);
  const canvas = document.createElement("canvas");
  canvas.width = CNV_W;
  canvas.height = CNV_H;
  canvas.style="position:absolute;left:640px;top:28px"
  // document.body.appendChild(canvas);
  let ctx = canvas.getContext('2d',{willReadFrequently:true});

  await untilReady(['FilesetResolver','videoLoaded'])

  let faceDetector;
  const initializefaceDetector = async () => {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );
    faceDetector = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
        delegate: "GPU"
      },
      runningMode: "VIDEO"
    });
  };
  
  await initializefaceDetector();
  let pW = GRD_COL*4;
  let pH = GRD_ROW*2;
  let pix = new Array(pW*pH);

  let eyes = [];
  let noses = [];
  let lastVideoTime = -1;
  async function predictWebcam() {
    let startTimeMs = performance.now();
    if (videoElement.currentTime !== lastVideoTime) {
      lastVideoTime = videoElement.currentTime;
      const detections = faceDetector.detectForVideo(videoElement, startTimeMs).faceLandmarks;
      displayVideoDetections(detections);
    }
    window.requestAnimationFrame(predictWebcam);
  }
  predictWebcam();

  function displayVideoDetections(detections){
    eyes.splice(0,Infinity);
    noses.splice(0,Infinity);
    pix.fill(0);
    let ctx = cnv0.getContext('2d');
    ctx.clearRect(0,0,CNV_W,CNV_H);
    ctx.fillStyle="rgb(0,127,127)";
    ctx.strokeStyle="rgb(0,127,127)";
    ctx.lineJoin = "round";
    ctx.lineWidth = 25;
    ctx.filter="blur(10px)";

    for (let i = 0; i < detections.length; i++){
      function getpt(idx){
        return [CNV_W-detections[i][idx].x*CNV_W,detections[i][idx].y*CNV_H]
      }
      function getpts(ins){
        let ps = [];
        for (let j = 0; j < ins.length; j++){
          ps.push(getpt(ins[j].start));
          ps.push(getpt(ins[j].end));
        }
        return ps;
      }
      function dist(a,b){
        return Math.hypot(a[0]-b[0],a[1]-b[1]);
      }
      let es;
      es = getpts(FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS);
      eyes.push([(es[0][0] + es[2][0] + es[4][0] + es[6][0])/4,
                 (es[0][1] + es[2][1] + es[4][1] + es[6][1])/4,
                 dist(getpt(263),getpt(362)),
                 dist(getpt(386),getpt(374)),

                ]);
      es = getpts(FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS);
      eyes.push([(es[0][0] + es[2][0] + es[4][0] + es[6][0])/4,
                 (es[0][1] + es[2][1] + es[4][1] + es[6][1])/4,
                 dist(getpt(33),getpt(133)),
                 dist(getpt(159),getpt(145)),
                ]);

      noses.push(getpt(20));
      noses.push(getpt(250));

      function line(x0,y0,x1,y1){
        let dx = Math.abs(x1 - x0)
        let sx = (x0 < x1) ? 1 : -1
        let dy = -Math.abs(y1 - y0)
        let sy = (y0 < y1) ? 1 : -1
        let error = dx + dy
        while (true){
          pix[y0*pW+x0] = 1;
          let e2 = 2 * error;
          if (e2 >= dy){
            if (x0 == x1) break;
            error += dy;
            x0 += sx
          }
          if (e2 <= dx){
            if (y0 == y1) break;
            error += dx;
            y0 += sy
          }
        }
      }

      function draw_lines(ins){
        for (let j = 0; j < ins.length; j++){
          let a = getpt(ins[j].start);
          let b = getpt(ins[j].end);
          line(~~(a[0]/CNV_W*pW), ~~(a[1]/CNV_H*pH), ~~(b[0]/CNV_W*pW), ~~(b[1]/CNV_H*pH));
        }
      }
      draw_lines(FaceLandmarker.FACE_LANDMARKS_FACE_OVAL.slice(6,-6));
      draw_lines(FaceLandmarker.FACE_LANDMARKS_LIPS.slice(20));
      draw_lines(FaceLandmarker.FACE_LANDMARKS_LEFT_EYEBROW.slice(6));
      draw_lines(FaceLandmarker.FACE_LANDMARKS_RIGHT_EYEBROW.slice(6));

      let outl = getpts(FaceLandmarker.FACE_LANDMARKS_FACE_OVAL).filter((x,i)=>i%2);
      ctx.beginPath();
      for (let j = 0; j < outl.length; j++){
        let [x,y] = outl[j];
        ctx[j?'lineTo':'moveTo'](x,y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // console.log(JSON.stringify(eyes));
  }

  // let divs = [];
  // for (let i = 0; i < GRD_ROW; i++){
  //   for (let j = 0; j < GRD_COL*2; j++){
  //     let div = document.createElement("pre");
  //     div.style = `position:absolute;font-size:24px;font-family:Source Code Pro, monospace;left:${14*j}px; top:${28*i}px`;
  //     document.body.appendChild(div);
  //     divs.push(div);
  //   }
  // }

  let input = new Float32Array(GRD*GRD*GRD_ROW*GRD_COL*2);


  let gl = cnv1.getContext('webgl');
  let font = new GLFONT(gl);
  font.build(GRD_COL*2,GRD_ROW);

  
  let cons = new Array(GRD_COL*2*GRD_ROW).fill(' ');
  let oldcons = cons.slice();

  function loop(){
    ctx.save();
    ctx.translate(CNV_W,0);
    ctx.scale(-1, 1);
    ctx.drawImage(videoElement,0,0,CNV_W,CNV_H);
    ctx.restore();



    let sob = Sobel.process(canvas);
    // let ada = adaptive(sob);
    ctx.drawImage(sob,0,0);
    ctx.drawImage(cnv0,0,0);

    let imgdat = ctx.getImageData(0,0,CNV_W,CNV_H);

    for (let i = 0; i < GRD_ROW; i++){
      for (let j = 0; j < GRD_COL*2; j++){
        let idx = i*GRD_COL*2+j;
        for (let k = 0; k < GRD; k++){
          for (let l = 0; l < GRD; l++){
            if (j*GRD/2+l >= CNV_W){
              input[idx*GRD*GRD + k*GRD+l] = 0;
            }else{
              input[idx*GRD*GRD + k*GRD+l] = imgdat.data[((i*GRD+k)*CNV_W + j*GRD/2+l)*4]/255.0;
            }

          }
        }
      }
    }
    let pred = NN.predictBatch(input,GRD_ROW*GRD_COL*2);
    for (let i = 0; i < GRD_ROW; i++){
      for (let j = 0; j < GRD_COL*2; j++){
        cons[i*GRD_COL*2+j]=pred[i*GRD_COL*2+j];
      }
    }

    for (let i = 0; i < GRD_ROW; i++){
      for (let j = 0; j < GRD_COL*2; j++){
        let a = pix[(i*2+0) * pW + j*2+0];
        let b = pix[(i*2+0) * pW + j*2+1];
        let c = pix[(i*2+1) * pW + j*2+0];
        let d = pix[(i*2+1) * pW + j*2+1];
        let n = (d<<3) | (c<<2) | (b<<1) | a
        //ab
        //cd
        if (n){
          cons[i*GRD_COL*2+j] = " `'\",[/p.\\]q_bq#"[n]
        }
      }
    }

    for (let i = 0; i < noses.length; i++){
      let [x,y] = noses[i];
      let gx = ~~(x/(GRD/2));
      let gy = ~~(y/GRD);
      cons[gy*GRD_COL*2+gx] = '*';
    }
    for (let i = 0; i < eyes.length; i++){
 
      let [x,y,w,h] = eyes[i];
      let gx = ~~(x/(GRD/2));
      let gy = ~~(y/GRD);
      if (h/w > 0.45){
        if (gx>0)cons[gy*GRD_COL*2+gx-1] = '(';
        if (gx<GRD_COL*2-1)cons[gy*GRD_COL*2+gx+1] = ')';
        cons[gy*GRD_COL*2+gx] = '@';
      }else if (h/w > 0.3){
        if (gx>0)cons[gy*GRD_COL*2+gx-1] = '<';
        if (gx<GRD_COL*2-1)cons[gy*GRD_COL*2+gx+1] = '>';
        cons[gy*GRD_COL*2+gx] = '@';
      }else if (h/w > 0.2){
        if (gx>0)cons[gy*GRD_COL*2+gx-1] = '-';
        if (gx<GRD_COL*2-1)cons[gy*GRD_COL*2+gx+1] = '-';
        cons[gy*GRD_COL*2+gx] = 'e';
      }else{
        if (gx>0)cons[gy*GRD_COL*2+gx-1] = '-';
        if (gx<GRD_COL*2-1)cons[gy*GRD_COL*2+gx+1] = '-';
        cons[gy*GRD_COL*2+gx] = '=';
      }
    }

    font.text(cons.map(x=>x.charCodeAt(0)));
    let nch = cons.filter((x,i)=>x!=oldcons[i]).length;
    oldcons = cons.slice();

    Crt.process(cnv1);

    for (let i = 0; i < ~~(nch/50); i++){
      setTimeout(clack, Math.random()*1000);
    }


    requestAnimationFrame(loop);
  }
  loop();

}
main();
</script>

let template = [0, 0, 1, 0, 0.5, Math.sqrt(3)/2];
template.shape = [template.length/2,2];
let isdown = 0;

let mat = [1,0,0,1,0,0];
  
solve();

function solve(){
  let points = pts.flat();
  points.shape = [pts.length,2];
  mat = fit_polygon_affine_nlls(points,template);
}
function show_template(){
  
}
  
cnv.addEventListener('mousedown',function(e){
  isdown = 1;
  pts.splice(0,Infinity);
  let rect = cnv.getBoundingClientRect();
  let x = (e.clientX - rect.left)/cnv.width;
  let y = (e.clientY - rect.top)/cnv.height;
  pts.push([x,y]);
})
cnv.addEventListener('mousemove',function(e){
  if (isdown){
    let rect = cnv.getBoundingClientRect();
    let x = (e.clientX - rect.left)/cnv.width;
    let y = (e.clientY - rect.top)/cnv.height;
    if (Math.hypot(x-pts.at(-1)[0],y-pts.at(-1)[1])>0.01){
      pts.push([x,y]);
    }
    solve();
  }
})
cnv.addEventListener('mouseup',function(){
  isdown = 0;
  solve();
})

function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,cnv.width,cnv.height);

  if (pts.length>1){
    ctx.strokeStyle = "red";
    ctx.beginPath();
    for (let i = 0; i < template.length/2; i++){
      let [x,y] = template.slice(i*2,i*2+2);
      let [a,b,c,d,e,f] = mat;
      let x1 = a*x+b*y+e;
      let y1 = c*x+d*y+f;
      x1 *=cnv.width;
      y1 *=cnv.height;
      ctx[i?'lineTo':'moveTo'](x1,y1);
    }
    ctx.closePath();
    ctx.stroke();
  }
  
  for (let i = 0; i < pts.length; i++){
    let [x,y] = pts[i];
    x*=cnv.width;
    y*=cnv.height;
    ctx.fillRect(x-1,y-1,2,2);
  }

}
animate();

</body>
<script src="fit.js"></script>
<script>


let cnv = document.createElement("canvas");
cnv.width = 200;
cnv.height = 200;
cnv.style="position:absolute;left:0px;top:0px;border:1px solid black"
document.body.appendChild(cnv);
let ctx = cnv.getContext('2d');

let pts = [];
let template = [0, 0, 1, 0, 0.5, Math.sqrt(3)/2];
template.shape = [template.length/2,2];
let isdown = 0;

let mat = [1,0,0,1,0,0];

cnv.addEventListener('mousedown',function(e){
  isdown = 1;
  pts.splice(0,Infinity);
  pts.push([e.clientX/cnv.width,e.clientY/cnv.height]);
})
cnv.addEventListener('mousemove',function(e){
  if (isdown){
    let x = e.clientX/cnv.width;
    let y = e.clientY/cnv.height;
    if (Math.hypot(x-pts.at(-1)[0],y-pts.at(-1)[1])>0.01){
      pts.push([x,y]);
    }
    let points = pts.flat();
    points.shape = [pts.length,2];
    mat = fit_polygon_affine_nlls(points,template);
    console.log(mat);
  }
})
cnv.addEventListener('mouseup',function(){
  isdown = 0;
  let points = pts.flat();
  points.shape = [pts.length,2];
  mat = fit_polygon_affine_nlls(points,template);
  console.log(mat);
})

function animate(){
  requestAnimationFrame(animate);
  ctx.clearRect(0,0,cnv.width,cnv.height);
  for (let i = 0; i < pts.length; i++){
    let [x,y] = pts[i];
    x*=cnv.width;
    y*=cnv.height;
    ctx.fillRect(x-1,y-1,2,2);
  }

  ctx.beginPath();
  for (let i = 0; i < template.length/2; i++){
    let [x,y] = template.slice(i*2,i*2+2);
    let [a,b,c,d,e,f] = mat;
    let x1 = a*x+b*y+e;
    let y1 = c*x+d*y+f;
    x1 *=cnv.width;
    y1 *=cnv.height;
    ctx[i?'lineTo':'moveTo'](x1,y1);
  }
  ctx.closePath();
  ctx.stroke();

}
animate();

  
  
</script>
